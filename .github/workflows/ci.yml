name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  DATABASE_URL: postgresql+asyncpg://radar:radar@localhost:5433/radar
  TEST_DATABASE_URL: postgresql+asyncpg://radar:radar@localhost:5433/radar_test
  REFRESH_TOKEN: ci-placeholder

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Typecheck (mypy)
        run: uv run mypy app

      - name: Test (pytest)
        run: uv run pytest
