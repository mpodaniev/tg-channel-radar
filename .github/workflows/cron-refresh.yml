name: Cron Refresh

on:
  schedule:
    # Offset from :00/:30 -- GitHub's shared runners see the heaviest load exactly on the
    # hour and half-hour, and scheduled runs at those marks can be delayed or dropped.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call /internal/refresh
        run: |
          curl --fail --show-error --max-time 120 --retry 1 --retry-delay 5 \
            -X POST "${{ secrets.APP_URL }}/internal/refresh" \
            -H "X-Refresh-Token: ${{ secrets.REFRESH_TOKEN }}"
