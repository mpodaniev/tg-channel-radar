<form class="add-channel" method="post" action="/api/channels"
      hx-post="/api/channels" hx-target="#channels-tbody" hx-swap="afterbegin"
      hx-on::after-request="if(event.detail.successful && !event.detail.xhr.getResponseHeader('HX-Retarget')) this.reset()">
  <input type="text" name="username" placeholder="@channel or t.me/channel" required>
  <button type="submit">Add channel</button>
</form>
