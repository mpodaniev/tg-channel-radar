databases:
  - name: channel-radar-db
    plan: free

services:
  - type: web
    name: channel-radar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # Render's Postgres connection string uses the `postgresql://` scheme; asyncpg needs
      # `postgresql+asyncpg://`. Take the connection string from the channel-radar-db dashboard
      # and add `+asyncpg` after `postgresql` before pasting it here -- do not use `fromDatabase`
      # auto-linking, it would paste the unmodified scheme.
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: REFRESH_TOKEN
        sync: false
      - key: APP_ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO
      # Render's default Python (3.14 at the time of writing) doesn't satisfy this project's
      # pyproject.toml constraint (>=3.12,<3.13) -- pin it explicitly so a Blueprint re-sync
      # can't silently regress to a build-breaking default again.
      - key: PYTHON_VERSION
        value: "3.12.8"
